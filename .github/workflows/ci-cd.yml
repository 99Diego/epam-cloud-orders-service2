name: CI/CD Pipeline - LocalStack Infrastructure

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  lint-and-unit-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8

      - name: Python Linting
        run: flake8 src/ tests/ --max-line-length=100 --ignore=E501,W503

      - name: Run Unit Tests
        run: pytest tests/unit/

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Format & Validate
        run: |
          cd terraform
          terraform fmt -check
          terraform init -backend=false
          terraform validate

  integration-test:
    name: LocalStack E2E Test
    needs: lint-and-unit-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install LocalStack & Dependencies
        run: |
          pip install localstack terraform-local boto3 pytest

      - name: Start LocalStack
        run: |
          localstack start -d
          localstack wait -t 30

      - name: Deploy Infrastructure with Terraform (tflocal)
        run: |
          cd terraform
          tflocal init
          tflocal apply -auto-approve

      - name: Run Integration Tests
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: mock_key
          AWS_SECRET_ACCESS_KEY: mock_secret
          AWS_DEFAULT_REGION: us-east-1
        run: |
          python tests/integration/test_e2e.py
