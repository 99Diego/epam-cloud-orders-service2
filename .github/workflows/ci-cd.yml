name: CI/CD Pipeline - LocalStack Infrastructure

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  lint-and-unit-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8 boto3

      - name: Python Linting
        run: flake8 src/ tests/ --max-line-length=100 --ignore=E501,W503

      - name: Run Unit Tests
        env:
          PYTHONPATH: .
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: mock_key
          AWS_SECRET_ACCESS_KEY: mock_secret
        run: pytest tests/unit/

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Format & Validate
        run: |
          cd terraform
          terraform fmt -check
          terraform init -backend=false
          terraform validate

  integration-test:
    name: LocalStack E2E Test
    needs: lint-and-unit-test
    runs-on: ubuntu-latest

    # Define LocalStack as native service of GitHub Actions
    services:
      localstack:
        image: localstack/localstack:3.0.0
        ports:
          - 4566:4566
          - 4510-4559:4510-4559
        env:
          SERVICES: s3, lambda, dynamodb, sqs
          AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Tools & Dependencies
        run: |
          pip install terraform-local boto3 pytest

      - name: Verify LocalStack Health
        run: |
          curl -s http://localhost:4566/_localstack/health

      - name: Deploy Infrastructure with Terraform (tflocal)
        run: |
          cd terraform
          tflocal init
          tflocal apply -auto-approve

      - name: Run Integration Tests
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: mock_key
          AWS_SECRET_ACCESS_KEY: mock_secret
          AWS_DEFAULT_REGION: us-east-1
        run: |
          python tests/integration/test_e2e.py
